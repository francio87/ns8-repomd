name: Publish NS8 software catalog

on:
  push:
    branches: [main]
  schedule:
    - cron: "25 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out catalog
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install catalog generator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
          python -m pip install filetype semver PyYAML
      - name: Generate repository metadata
        run: |
          mkdir -p _site
          app_count=0
          for app_dir in */; do
            if [ -f "${app_dir}metadata.json" ]; then
              cp -a "$app_dir" _site/
              app_count=$((app_count + 1))
            fi
          done
          test "$app_count" -gt 0
          cp pins.yml _site/
          (cd _site && python ../createrepo.py .)
          test -s _site/repodata.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
