name: Publish NS8 software catalog

on:
  push:
    branches: [main]
  schedule:
    - cron: "25 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install catalog generator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
          python -m pip install filetype semver PyYAML
      - name: Generate repository metadata
        run: |
          mkdir -p _site
          cp -a borgbackupserver _site/
          python createrepo.py _site
          test -s _site/repodata.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
